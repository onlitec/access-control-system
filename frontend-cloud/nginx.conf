server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O service worker e o index.html NUNCA podem ser cacheados: se ficarem
    # presos no cache do navegador, o usuário continua rodando uma versão
    # antiga do app para sempre (foi o que aconteceu ao trocar o login).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }
    # O nginx não conhece a extensão .webmanifest e serviria como
    # application/octet-stream — com o tipo errado o navegador IGNORA o manifest
    # e não oferece a instalação do app ("Adicionar à tela inicial").
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # assets têm hash no nome — podem ser cacheados agressivamente
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA: qualquer rota cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
