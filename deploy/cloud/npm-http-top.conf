# ── OnliAcesso Cloud multi-tenant: map slug → IP Tailscale ──────────────────
# Copiar para {volume npm_data}/nginx/custom/http_top.conf — o NPM inclui esse
# arquivo no TOPO do bloco http, valendo para todos os proxy hosts (o map fica
# global, mas só o host de cloud.onlitec.com.br usa as variáveis).
#
# ⚠️  Um erro de sintaxe AQUI derruba o `nginx -t` de TODOS os proxy hosts do
#     NPM. Nunca editar sem rodar `nginx -t` no container antes do reload —
#     o add-tenant.sh faz isso (e faz rollback) automaticamente.
#
# $onli_tenant vem do named capture das locations /t/{slug}/... (advanced do
# proxy host — ver nginx-proxy-manager.conf). O map é avaliado lazy, então a
# variável já está preenchida quando o nginx a consulta.

map $onli_tenant $onli_tenant_host {
    default "";
    include /data/nginx/custom/onliacesso-tenants.map;
}
