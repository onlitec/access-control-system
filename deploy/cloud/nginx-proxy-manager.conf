# ── OnliAcesso Cloud — MULTI-TENANT ─────────────────────────────────────────
# Colar em: Nginx Proxy Manager → proxy host de cloud.onlitec.com.br → Advanced.
#
# Cada cliente do OnliAcesso tem um slug (ex.: "onlitec") e as URLs são
# /t/{slug}/api|hls|webrtc/... . O slug vira o IP Tailscale do servidor do
# cliente pelo map $onli_tenant → $onli_tenant_host, definido em
# /data/nginx/custom/http_top.conf (ver npm-http-top.conf neste diretório),
# que inclui o registry /data/nginx/custom/onliacesso-tenants.map — gerado
# pelo add-tenant.sh, NUNCA editado à mão sem `nginx -t` depois.
#
# Slug desconhecido → 404 antes de qualquer proxy.
# proxy_pass com VARIÁVEL exige $is_args$args explícito (a query não é anexada
# sozinha) e, como o registry usa IP (não nome), não precisa de resolver —
# MagicDNS NÃO resolve dentro do container do NPM (verificado 2026-07-12).
#
# Portas no servidor de cada cliente:
#   3001 = backend OnliAcesso (login + API das câmeras)
#   8888 = MediaMTX HLS (exige ?jwt= — validado pelo backend DO CLIENTE)
#   8889 = MediaMTX WebRTC/WHEP (signaling)
#
# Isolamento entre clientes: cada instalação tem JWT_SECRET próprio (gerado no
# install), então o token do cliente A é rejeitado pelo backend/stream-auth do
# cliente B. O VPS só roteia — não guarda usuários.
#
# A API de controle do MediaMTX (9997) NÃO é exposta NUNCA: /v3/config/paths/list
# devolve as URLs RTSP COM AS SENHAS das câmeras. A PWA lista as câmeras pelo
# backend (/api/vms/devices), que nunca retorna senha.

# a regex fica ENTRE ASPAS: sem elas o nginx lê o { de {2,32} como abertura de bloco
location ~ "^/t/(?<onli_tenant>[a-z0-9-]{2,32})/api/(?<onli_rest>.*)$" {
    if ($onli_tenant_host = "") { return 404; }
    proxy_pass http://$onli_tenant_host:3001/api/$onli_rest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ "^/t/(?<onli_tenant>[a-z0-9-]{2,32})/hls/(?<onli_rest>.*)$" {
    if ($onli_tenant_host = "") { return 404; }
    # alto volume (um GET por segmento) e ?jwt= na query — fora do access log
    access_log off;
    proxy_pass http://$onli_tenant_host:8888/$onli_rest$is_args$args;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache, no-store" always;
}

# WebRTC/WHEP: só o SIGNALING (oferta/resposta SDP) passa por aqui. A MÍDIA
# trafega por UDP via TURN (coturn neste VPS, porta 3478) — é o que derruba a
# latência remota de ~2-6s (HLS) para menos de 1s.
location ~ "^/t/(?<onli_tenant>[a-z0-9-]{2,32})/webrtc/(?<onli_rest>.*)$" {
    if ($onli_tenant_host = "") { return 404; }
    proxy_pass http://$onli_tenant_host:8889/$onli_rest$is_args$args;
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    # o MediaMTX devolve os ICE servers (TURN) em headers Link — o navegador precisa deles
    proxy_pass_header Link;
}

# /t/ que não casou com as regex acima (slug vazio/inválido, ex.: /t//api/...)
# morre aqui com 404 — sem isso cairia no location / e voltaria o HTML da SPA
# para chamadas de API (o famoso "Unexpected token '<' ... is not valid JSON").
location /t/ { return 404; }

# ── Downloads dos instaladores + manifesto de atualização ───────────────────
# Publicados pelo CI (release.yml) em /data/onliacesso-downloads (volume do
# NPM). O latest.json alimenta o "Verificar atualizações" do painel Admin de
# cada cliente — nunca pode ficar em cache.
location = /downloads/latest.json {
    alias /data/onliacesso-downloads/latest.json;
    add_header Cache-Control "no-cache" always;
}
location /downloads/ {
    alias /data/onliacesso-downloads/;
    autoindex off;
}

# ── LEGADO single-tenant (REMOVER após a transição — meta: 2026-07-26) ──────
# PWAs já instaladas em celulares usam /api|/hls|/webrtc sem prefixo até o
# service worker atualizar (autoUpdate no próximo open). Apontam para o
# servidor Windows original (desktop-b3mtp33 / 100.77.220.32 = tenant galvatec).

location /api/ {
    proxy_pass http://100.77.220.32:3001/api/;
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /hls/ {
    proxy_pass http://100.77.220.32:8888/;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "no-cache, no-store" always;
}

location /webrtc/ {
    proxy_pass http://100.77.220.32:8889/;
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass_header Link;
}
