# ── OnliAcesso Cloud Bridge ─────────────────────────────────────────────────
# Servidor local (Windows VMS) via Tailscale: 100.77.220.32
#   3001 = backend OnliAcesso (login + API das câmeras)
#   8888 = MediaMTX HLS (exige ?jwt= — validado pelo backend)
#
# A API de controle do MediaMTX (9997) NÃO é exposta: /v3/config/paths/list
# devolve as URLs RTSP COM AS SENHAS das câmeras. A PWA lista as câmeras pelo
# backend (/api/vms/devices), que nunca retorna senha.
#
# WebRTC (/webrtc/) também não é exposto: pela internet exigiria um servidor
# TURN (os candidatos ICE do servidor são endereços privados). Remoto usa HLS.

location /api/ {
    proxy_pass http://100.77.220.32:3001/api/;
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /hls/ {
    proxy_pass http://100.77.220.32:8888/;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "no-cache, no-store" always;
}

# WebRTC/WHEP: só o SIGNALING (oferta/resposta SDP) passa por aqui. A MÍDIA
# trafega por UDP via TURN (coturn neste VPS, porta 3478) — é o que derruba a
# latência remota de ~2-6s (HLS) para menos de 1s.
location /webrtc/ {
    proxy_pass http://100.77.220.32:8889/;
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # o MediaMTX devolve os ICE servers (TURN) em headers Link — o navegador precisa deles
    proxy_pass_header Link;
}
