# ── OnliAcesso Cloud Bridge ─────────────────────────────────────────────────
# Colar em: Nginx Proxy Manager → proxy host de cloud.onlitec.com.br → Advanced.
#
# ⚠️  ESTE ARQUIVO APONTA PARA O SERVIDOR LOCAL. Ao trocar o servidor de
#     máquina, é AQUI (e nas regras de firewall do Windows) que o endereço muda.
#
# Endereço do servidor local na Tailscale. Prefira o NOME (MagicDNS) ao IP: o
# nome acompanha a máquina mesmo que o IP 100.x mude, então uma reinstalação não
# quebra o acesso remoto. O nome aparece em `tailscale status` no servidor.
#
#   Recomendado:  http://desktop-b3mtp33:3001      (MagicDNS)
#   Alternativa:  http://100.77.220.32:3001        (IP fixo — muda se reinstalar)
#
# Para usar MagicDNS, o VPS precisa estar na mesma tailnet com MagicDNS ligado
# (Tailscale admin → DNS → Enable MagicDNS) e resolver o nome (`ping desktop-...`).
#
# Portas do servidor local:
#   3001 = backend OnliAcesso (login + API das câmeras)
#   8888 = MediaMTX HLS (exige ?jwt= — validado pelo backend)
#   8889 = MediaMTX WebRTC/WHEP (signaling)
#
# A API de controle do MediaMTX (9997) NÃO é exposta: /v3/config/paths/list
# devolve as URLs RTSP COM AS SENHAS das câmeras. A PWA lista as câmeras pelo
# backend (/api/vms/devices), que nunca retorna senha.

location /api/ {
    proxy_pass http://desktop-b3mtp33:3001/api/;
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /hls/ {
    proxy_pass http://desktop-b3mtp33:8888/;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "no-cache, no-store" always;
}

# WebRTC/WHEP: só o SIGNALING (oferta/resposta SDP) passa por aqui. A MÍDIA
# trafega por UDP via TURN (coturn neste VPS, porta 3478) — é o que derruba a
# latência remota de ~2-6s (HLS) para menos de 1s.
location /webrtc/ {
    proxy_pass http://desktop-b3mtp33:8889/;
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # o MediaMTX devolve os ICE servers (TURN) em headers Link — o navegador precisa deles
    proxy_pass_header Link;
}
