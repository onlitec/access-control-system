# OnliAcesso — proxy reverso (Linux)
# Instalado em /etc/nginx/sites-available/onliacesso (link em sites-enabled).
#
# Diferença consciente para o Windows: lá os painéis /painel/ e /admin/ são
# servidos por dois processos Node (serve-static.js) porque o nginx empacotado é
# mínimo. No Linux o próprio nginx entrega os arquivos estáticos com try_files —
# dois serviços a menos, e o SPA fallback fica no lugar certo.

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=setup_limit:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream onliacesso_api      { server 127.0.0.1:3001; }
upstream onliacesso_visitor  { server 127.0.0.1:3002; }
upstream onliacesso_mediamtx { server 127.0.0.1:8888; }  # MediaMTX HLS (VMS)
upstream onliacesso_webrtc   { server 127.0.0.1:8889; }  # MediaMTX WebRTC/WHEP (VMS)

server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    client_max_body_size 50m;
    access_log /var/log/nginx/onliacesso.access.log;
    error_log  /var/log/nginx/onliacesso.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 300s;

    # ------------------------------------------------------------ API (3001)
    location /api/ {
        # streams de câmera (ffmpeg/MJPEG) exigem resposta sem buffer
        proxy_buffering off;
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://onliacesso_api;
    }

    location /api/auth/login {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://onliacesso_api;
    }

    location /api/resident-auth/login {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://onliacesso_api;
    }

    location /api/setup/ {
        limit_req zone=setup_limit burst=2 nodelay;
        proxy_pass http://onliacesso_api;
    }

    # ------------------------------- Portal morador/visitante (Next.js, 3002)
    # sem barra final: o Next responde 200 em /login e redireciona /login/ ->
    # /login; com "location /login/" o nginx criaria um loop de 308
    location /login {
        proxy_pass http://onliacesso_visitor;
    }

    location /_next/ {
        proxy_pass http://onliacesso_visitor;
    }

    # ----------------------------- Painel das portarias (SPA, só rede interna)
    # sem barra final: redireciona para a versão com barra (alias não faz isso)
    location = /painel { return 301 /painel/; }
    location = /admin  { return 301 /admin/; }

    location /painel/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        alias /opt/onliacesso/apps/frontend-access/dist/;
        try_files $uri $uri/ /painel/index.html;
    }

    # -------------------------------- Interface admin (SPA, só rede interna)
    location /admin/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        alias /opt/onliacesso/apps/frontend-admin/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ------------------------ MediaMTX HLS — VMS (só interna, sem rate limit)
    # Frontend envia: GET /streams/{path}/index.m3u8?jwt=TOKEN
    # MediaMTX espera: GET /{path}/index.m3u8   (o JWT é validado no backend)
    location /streams/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        proxy_buffering      off;
        proxy_cache          off;
        add_header           Cache-Control "no-cache, no-store" always;
        proxy_read_timeout   60s;
        rewrite ^/streams/(.*)$ /$1 break;
        proxy_pass           http://onliacesso_mediamtx;
    }

    # ---------------------------- MediaMTX WebRTC/WHEP — VMS (live sem delay)
    # Só o SIGNALING passa aqui; a mídia trafega em UDP 8189 direto do MediaMTX
    # ao navegador — é por isso que a porta 8189/udp precisa estar liberada.
    location /webrtc/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        proxy_buffering      off;
        proxy_cache          off;
        proxy_read_timeout   60s;
        rewrite ^/webrtc/(.*)$ /$1 break;
        proxy_pass           http://onliacesso_webrtc;
    }

    # ------------------------------------------------------- Raiz → painel
    location = / {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        return 302 /painel/;
    }
}
