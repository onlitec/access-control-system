# OnliAcesso - proxy reverso (Windows)
# Instalado em C:\OnliAcesso\binaries\nginx\conf\nginx.conf

worker_processes  2;

# caminhos relativos ao prefix do nginx (C:\OnliAcesso\binaries\nginx)
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log  logs/access.log;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Rate limiting (by IP) for security-critical endpoints
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=setup_limit:10m rate=3r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    upstream onliacesso_api     { server 127.0.0.1:3001; }
    upstream onliacesso_visitor { server 127.0.0.1:3002; }
    upstream onliacesso_access  { server 127.0.0.1:3003; }
    upstream onliacesso_admin   { server 127.0.0.1:3004; }
    upstream onliacesso_mediamtx { server 127.0.0.1:8888; }  # MediaMTX HLS (VMS)
    upstream onliacesso_webrtc   { server 127.0.0.1:8889; }  # MediaMTX WebRTC/WHEP (VMS)

    # TODO(TLS): HTTPS termination foi planejado (redirect 80->443 + cert
    # auto-assinado) mas a geracao da chave privada em PEM a partir do
    # certificado (New-SelfSignedCertificate) exige OpenSSL ou codificacao
    # ASN.1/PKCS#1 manual - nao ha suporte nativo em PowerShell 5.1 (o
    # `powershell.exe` usado pelo Inno Setup, nao `pwsh`) para exportar
    # RSA.ExportRSAPrivateKeyPem() (isso so existe em .NET 5+/PowerShell 7).
    # Uma tentativa de implementar isso na mao gerou uma chave corrompida
    # (68 bytes ao inves de ~1700) - inaceitavel para um sistema de controle
    # de acesso fisico. Ate empacotar um openssl.exe (ou testar builds em
    # PowerShell 5.1 real), o proxy permanece em HTTP simples.
    server {
        listen       80;
        server_name  _;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;

        # ------------------------------------------------------ API (3001)
        location /api/ {
            # streams de câmera (ffmpeg) exigem resposta sem buffer
            proxy_buffering off;
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://onliacesso_api;
        }

        # Rate limit on authentication endpoints
        location /api/auth/login {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass http://onliacesso_api;
        }

        location /api/resident-auth/login {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass http://onliacesso_api;
        }

        location /api/setup/ {
            limit_req zone=setup_limit burst=2 nodelay;
            proxy_pass http://onliacesso_api;
        }

        # --------------------------------- Portal morador/visitante (3002)
        # sem barra final: o Next responde 200 em /login e redireciona
        # /login/ -> /login; com "location /login/" o nginx redirecionava
        # /login -> /login/ e criava loop infinito de 308
        location /login {
            proxy_pass http://onliacesso_visitor;
        }

        # assets do Next.js (frontend-visitor)
        location /_next/ {
            proxy_pass http://onliacesso_visitor;
        }

        # ------------------------- Painel das portarias (3003, só interna)
        location /painel/ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;
            proxy_pass http://onliacesso_access;
        }

        # ---------------------------- Interface admin (3004, só interna)
        location /admin/ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;
            proxy_pass http://onliacesso_admin;
        }

        # ------------------- MediaMTX HLS — VMS (só interna, sem rate limit)
        # Frontend envia: GET /streams/{path}/index.m3u8?jwt=TOKEN
        # MediaMTX espera: GET /{path}/index.m3u8   (valida o JWT no backend)
        location /streams/ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;
            proxy_buffering      off;
            proxy_cache          off;
            add_header           Cache-Control "no-cache, no-store" always;
            proxy_read_timeout   60s;
            rewrite ^/streams/(.*)$ /$1 break;
            proxy_pass           http://onliacesso_mediamtx;
        }

        # ------------------- MediaMTX WebRTC/WHEP — VMS (live sem delay)
        # Só o SIGNALING passa aqui (POST da oferta SDP em /webrtc/{path}/whep);
        # a midia trafega por UDP direto do servidor (porta 8189) ao navegador.
        location /webrtc/ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;
            proxy_buffering      off;
            proxy_cache          off;
            proxy_read_timeout   60s;
            rewrite ^/webrtc/(.*)$ /$1 break;
            proxy_pass           http://onliacesso_webrtc;
        }

        # ------------------------------------------------- Raiz → painel
        location / {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;
            proxy_pass http://onliacesso_access;
        }
    }
}
