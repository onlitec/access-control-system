# OnliAcesso - proxy reverso (Windows)
# Instalado em C:\OnliAcesso\binaries\nginx\conf\nginx.conf

worker_processes  2;

# caminhos relativos ao prefix do nginx (C:\OnliAcesso\binaries\nginx)
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log  logs/access.log;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Rate limiting (by IP) for security-critical endpoints
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=setup_limit:10m rate=3r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    upstream onliacesso_api     { server 127.0.0.1:3001; }
    upstream onliacesso_visitor { server 127.0.0.1:3002; }
    upstream onliacesso_access  { server 127.0.0.1:3003; }
    upstream onliacesso_admin   { server 127.0.0.1:3004; }

    # HTTP redirect to HTTPS
    server {
        listen       80;
        server_name  _;
        return 301 https://$host$request_uri;
    }

    # HTTPS server (main)
    server {
        listen       443 ssl http2;
        server_name  _;

        # TLS certificate and key (generated by install.ps1 at C:\OnliAcesso\certs\)
        ssl_certificate      C:/OnliAcesso/certs/onliacesso.crt;
        ssl_certificate_key  C:/OnliAcesso/certs/onliacesso.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;

        # ------------------------------------------------------ API (3001)
        location /api/ {
            # streams de câmera (ffmpeg) exigem resposta sem buffer
            proxy_buffering off;
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://onliacesso_api;
        }

        # Rate limit on authentication endpoints
        location /api/auth/login {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass http://onliacesso_api;
        }

        location /api/resident-auth/login {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass http://onliacesso_api;
        }

        location /api/setup/ {
            limit_req zone=setup_limit burst=2 nodelay;
            proxy_pass http://onliacesso_api;
        }

        # --------------------------------- Portal morador/visitante (3002)
        # sem barra final: o Next responde 200 em /login e redireciona
        # /login/ -> /login; com "location /login/" o nginx redirecionava
        # /login -> /login/ e criava loop infinito de 308
        location /login {
            proxy_pass http://onliacesso_visitor;
        }

        # assets do Next.js (frontend-visitor)
        location /_next/ {
            proxy_pass http://onliacesso_visitor;
        }

        # ------------------------- Painel das portarias (3003, só interna)
        location /painel/ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;
            proxy_pass http://onliacesso_access;
        }

        # ---------------------------- Interface admin (3004, só interna)
        location /admin/ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;
            proxy_pass http://onliacesso_admin;
        }

        # ------------------------------------------------- Raiz → painel
        location / {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;
            proxy_pass http://onliacesso_access;
        }
    }
}
